<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バレーボール守備範囲シミュレーター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* パターン保存・管理 */
    .control-panel {
      background-color: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-title {
      font-weight: bold;
      font-size: 14px;
      color: #3b82f6;
    }

    .pattern-bar {
      display: flex;
      gap: 8px;
    }

    select, input[type="text"] {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
    }

    button {
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 8px 12px;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: #2563eb; color: #fff; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-danger { background-color: #ef4444; color: #fff; }
    .btn-danger:hover { background-color: #dc2626; }

    /* ローテーション切り替えボタン */
    .rot-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .rot-btn {
      padding: 8px 0;
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
    }

    .rot-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* メインキャンバス領域 */
    .canvas-wrapper {
      width: 100%;
      background-color: #1e293b;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      touch-action: none;
    }

    /* ベンチ控え選手エリア */
    .bench-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bench-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .bench-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 12px;
    }

    .bench-item .badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* パラメータコントロールパネル */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      color: #ffffff;
    }

    .name-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }

    /* モーダル */
    dialog {
      margin: auto;
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 16px 0;
      max-height: 250px;
      overflow-y: auto;
    }

    .modal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- パターン保存・管理 -->
  <div class="control-panel">
    <div class="panel-title">チームパターン保存・読み込み</div>
    <div class="pattern-bar">
      <select id="patternSelect" style="flex: 1;"></select>
      <button id="savePatternBtn" class="btn-primary">保存</button>
      <button id="deletePatternBtn" class="btn-danger">削除</button>
    </div>
  </div>

  <!-- ローテーション選択 -->
  <div class="rot-container">
    <button type="button" class="rot-btn active">S1</button>
    <button type="button" class="rot-btn">S2</button>
    <button type="button" class="rot-btn">S3</button>
    <button type="button" class="rot-btn">S4</button>
    <button type="button" class="rot-btn">S5</button>
    <button type="button" class="rot-btn">S6</button>
  </div>

  <!-- メインキャンバス -->
  <div class="canvas-wrapper">
    <canvas id="courtCanvas" width="500" height="700"></canvas>
  </div>

  <!-- ベンチ控え選手 -->
  <div class="control-panel bench-container">
    <div class="panel-header">
      <span class="panel-title">ベンチ控え選手</span>
      <button id="addBenchBtn" class="btn-primary" style="padding: 4px 8px; font-size: 11px;">+ 控え追加</button>
    </div>
    <div class="bench-list" id="benchList"></div>
  </div>

  <!-- 選択中の選手パラメータ設定 -->
  <div class="control-panel">
    <div class="panel-header">
      <span class="player-badge" id="selectedBadge">L (リベロ)</span>
      <button id="openSwapModalBtn" class="btn-primary" style="background-color: #f59e0b;">交代（チェンジ）</button>
    </div>

    <div class="name-input-group">
      <span style="font-size: 12px; color: #94a3b8; white-space: nowrap;">登録選手名:</span>
      <input type="text" id="playerNameInput" style="flex: 1;" placeholder="選手名を入力">
    </div>

    <div class="slider-grid">
      <div class="slider-group">
        <div class="slider-label"><span>前（前方カバー）</span><span class="slider-val">Lv. 8</span></div>
        <input type="range" min="1" max="10" value="8">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>後（後方カバー）</span><span class="slider-val">Lv. 5</span></div>
        <input type="range" min="1" max="10" value="5">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>左（左側カバー）</span><span class="slider-val">Lv. 7</span></div>
        <input type="range" min="1" max="10" value="7">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>右（右側カバー）</span><span class="slider-val">Lv. 7</span></div>
        <input type="range" min="1" max="10" value="7">
      </div>
      <div class="slider-group" style="grid-column: span 2;">
        <div class="slider-label"><span>身体の向き（タッチ操作可）</span><span class="slider-val">90°</span></div>
        <input type="range" min="-180" max="180" value="90">
      </div>
    </div>
  </div>

</div>

<!-- 交代モーダル -->
<dialog id="swapModal">
  <div style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">メンバー交代</div>
  <div style="font-size: 12px; color: #94a3b8;">交代するベンチ選手を選択してください:</div>
  <div class="modal-list" id="modalBenchList"></div>
  <div style="display: flex; justify-content: flex-end;">
    <button id="closeModalBtn" style="background: #334155; color: #fff;">キャンセル</button>
  </div>
</dialog>

<script>
  const canvas = document.getElementById('courtCanvas');
  const ctx = canvas.getContext('2d');

  const selectedBadge = document.getElementById('selectedBadge');
  const playerNameInput = document.getElementById('playerNameInput');
  const sliders = document.querySelectorAll('.slider-group input');
  const valTexts = document.querySelectorAll('.slider-val');
  const patternSelect = document.getElementById('patternSelect');
  const benchList = document.getElementById('benchList');
  const swapModal = document.getElementById('swapModal');
  const modalBenchList = document.getElementById('modalBenchList');

  const court = { x: 40, y: 40, w: 420, h: 620, netY: 350 };
  let currentRotation = 'S1';

  // 1. 全ローテーション共通の選手マスターデータ
  let playersMaster = {
    'S':   { displayName: '山田', color: '#2563eb', fwd: 7, bwd: 4, left: 5, right: 6 },
    'OH1': { displayName: '佐藤', color: '#059669', fwd: 8, bwd: 5, left: 7, right: 7 },
    'MB1': { displayName: '高橋', color: '#d97706', fwd: 6, bwd: 3, left: 5, right: 5 },
    'OP':  { displayName: '田中', color: '#db2777', fwd: 8, bwd: 5, left: 7, right: 7 },
    'OH2': { displayName: '伊藤', color: '#059669', fwd: 8, bwd: 5, left: 7, right: 7 },
    'L':   { displayName: '渡辺', color: '#dc2626', fwd: 9, bwd: 6, left: 8, right: 8 }
  };

  // 各ローテーションの立ち位置・角度
  const defaultRotationPositions = {
    S1: [
      { id: 'S',   posName: 'S',   x: 390, y: 430, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 110, y: 390, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 250, y: 390, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 110, y: 560, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 390, y: 560, angle: 90 },
      { id: 'L',   posName: 'L',   x: 250, y: 600, angle: 90 }
    ],
    S2: [
      { id: 'S',   posName: 'S',   x: 250, y: 390, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 390, y: 560, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 110, y: 560, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 250, y: 600, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 110, y: 390, angle: 90 },
      { id: 'L',   posName: 'L',   x: 390, y: 430, angle: 90 }
    ],
    S3: [
      { id: 'S',   posName: 'S',   x: 110, y: 390, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 250, y: 600, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 110, y: 560, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 390, y: 560, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 250, y: 390, angle: 90 },
      { id: 'L',   posName: 'L',   x: 390, y: 430, angle: 90 }
    ],
    S4: [
      { id: 'S',   posName: 'S',   x: 110, y: 560, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 250, y: 390, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 390, y: 430, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 390, y: 560, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 250, y: 600, angle: 90 },
      { id: 'L',   posName: 'L',   x: 110, y: 390, angle: 90 }
    ],
    S5: [
      { id: 'S',   posName: 'S',   x: 250, y: 600, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 390, y: 430, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 250, y: 390, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 250, y: 560, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 110, y: 560, angle: 90 },
      { id: 'L',   posName: 'L',   x: 110, y: 390, angle: 90 }
    ],
    S6: [
      { id: 'S',   posName: 'S',   x: 390, y: 560, angle: 90 },
      { id: 'OH1', posName: 'OH1', x: 250, y: 390, angle: 90 },
      { id: 'MB1', posName: 'MB1', x: 110, y: 390, angle: 90 },
      { id: 'OP',  posName: 'OP',  x: 250, y: 600, angle: 90 },
      { id: 'OH2', posName: 'OH2', x: 390, y: 430, angle: 90 },
      { id: 'L',   posName: 'L',   x: 110, y: 560, angle: 90 }
    ]
  };

  let rotationPositions = JSON.parse(JSON.stringify(defaultRotationPositions));

  let benchPlayers = [
    { id: 'B1', posName: '控えS',  displayName: '鈴木', color: '#2563eb', fwd: 6, bwd: 4, left: 5, right: 5 },
    { id: 'B2', posName: '控えOH', displayName: '中村', color: '#059669', fwd: 8, bwd: 5, left: 7, right: 7 },
    { id: 'B3', posName: '控えMB', displayName: '小林', color: '#d97706', fwd: 6, bwd: 3, left: 5, right: 5 }
  ];

  let selectedPosId = 'L';
  let activeInteraction = null;
  let touchOffsetX = 0, touchOffsetY = 0;

  function getCourtPlayers() {
    return rotationPositions[currentRotation].map(pos => {
      const master = playersMaster[pos.id] || { displayName: pos.posName, color: '#3b82f6', fwd: 5, bwd: 5, left: 5, right: 5 };
      return { ...pos, ...master };
    });
  }

  function getSelectedPlayer() {
    const players = getCourtPlayers();
    return players.find(p => p.id === selectedPosId) || players[0];
  }

  function updateUI() {
    const p = getSelectedPlayer();
    if (!p) return;

    selectedBadge.textContent = `${p.posName} (${p.displayName})`;
    selectedBadge.style.backgroundColor = p.color;
    playerNameInput.value = p.displayName;

    sliders[0].value = p.fwd;   valTexts[0].textContent = `Lv. ${p.fwd}`;
    sliders[1].value = p.bwd;   valTexts[1].textContent = `Lv. ${p.bwd}`;
    sliders[2].value = p.left;  valTexts[2].textContent = `Lv. ${p.left}`;
    sliders[3].value = p.right; valTexts[3].textContent = `Lv. ${p.right}`;
    sliders[4].value = p.angle; valTexts[4].textContent = `${p.angle}°`;

    renderBenchList();
  }

  playerNameInput.addEventListener('input', (e) => {
    if (playersMaster[selectedPosId]) {
      playersMaster[selectedPosId].displayName = e.target.value;
    }
    updateUI();
    render();
  });

  const keys = ['fwd', 'bwd', 'left', 'right'];
  sliders.forEach((slider, idx) => {
    slider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      if (idx < 4) {
        if (playersMaster[selectedPosId]) {
          playersMaster[selectedPosId][keys[idx]] = val;
        }
      } else {
        const currentPos = rotationPositions[currentRotation].find(p => p.id === selectedPosId);
        if (currentPos) currentPos.angle = val;
      }
      updateUI();
      render();
    });
  });

  function renderBenchList() {
    benchList.innerHTML = '';
    benchPlayers.forEach((bp) => {
      const item = document.createElement('div');
      item.className = 'bench-item';
      item.innerHTML = `
        <span class="badge" style="background-color: ${bp.color};"></span>
        <span><b>${bp.displayName}</b> (${bp.posName})</span>
      `;
      benchList.appendChild(item);
    });
  }

  document.getElementById('openSwapModalBtn').addEventListener('click', () => {
    modalBenchList.innerHTML = '';
    if (benchPlayers.length === 0) {
      modalBenchList.innerHTML = '<div style="font-size:12px; color:#94a3b8;">控え選手がいません。</div>';
    } else {
      benchPlayers.forEach((bp, idx) => {
        const div = document.createElement('div');
        div.className = 'modal-item';
        div.innerHTML = `
          <span><b>${bp.displayName}</b> (${bp.posName})</span>
          <button class="btn-primary" style="padding:4px 8px; font-size:11px;" onclick="executeSwap(${idx})">交代</button>
        `;
        modalBenchList.appendChild(div);
      });
    }
    swapModal.showModal();
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => swapModal.close());

  window.executeSwap = function(benchIdx) {
    const currentMaster = playersMaster[selectedPosId];
    const benchP = benchPlayers[benchIdx];

    playersMaster[selectedPosId] = {
      displayName: benchP.displayName,
      color: benchP.color,
      fwd: benchP.fwd,
      bwd: benchP.bwd,
      left: benchP.left,
      right: benchP.right
    };

    benchPlayers[benchIdx] = {
      id: `B_${Date.now()}`,
      posName: '元スタメン',
      displayName: currentMaster.displayName,
      color: currentMaster.color,
      fwd: currentMaster.fwd,
      bwd: currentMaster.bwd,
      left: currentMaster.left,
      right: currentMaster.right
    };

    swapModal.close();
    updateUI();
    render();
  };

  document.getElementById('addBenchBtn').addEventListener('click', () => {
    const name = prompt('控え選手の名前を入力してください:', '加藤');
    if (!name) return;
    benchPlayers.push({
      id: `B_${Date.now()}`,
      posName: '控え',
      displayName: name,
      color: '#8b5cf6',
      fwd: 7, bwd: 5, left: 6, right: 6
    });
    updateUI();
  });

  const rotButtons = document.querySelectorAll('.rot-btn');
  rotButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      rotButtons.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentRotation = e.target.textContent;
      updateUI();
      render();
    });
  });

  function getSavedPatterns() {
    return JSON.parse(localStorage.getItem('volleyball_team_patterns')) || {};
  }

  function updatePatternSelect() {
    const patterns = getSavedPatterns();
    patternSelect.innerHTML = '<option value="">-- パターン選択 --</option>';
    Object.keys(patterns).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      patternSelect.appendChild(opt);
    });
  }

  document.getElementById('savePatternBtn').addEventListener('click', () => {
    const name = prompt('保存するパターン名を入力してください:');
    if (!name) return;
    const patterns = getSavedPatterns();
    patterns[name] = { playersMaster, rotationPositions, benchPlayers };
    localStorage.setItem('volleyball_team_patterns', JSON.stringify(patterns));
    updatePatternSelect();
    patternSelect.value = name;
    alert(`パターン「${name}」を保存しました。`);
  });

  document.getElementById('deletePatternBtn').addEventListener('click', () => {
    const name = patternSelect.value;
    if (!name) return alert('削除するパターンを選択してください。');
    if (confirm(`「${name}」を削除してもよろしいですか？`)) {
      const patterns = getSavedPatterns();
      delete patterns[name];
      localStorage.setItem('volleyball_team_patterns', JSON.stringify(patterns));
      updatePatternSelect();
    }
  });

  patternSelect.addEventListener('change', (e) => {
    const name = e.target.value;
    if (!name) return;
    const patterns = getSavedPatterns();
    if (patterns[name]) {
      playersMaster = patterns[name].playersMaster;
      rotationPositions = patterns[name].rotationPositions;
      benchPlayers = patterns[name].benchPlayers || [];
      updateUI();
      render();
    }
  });

  // --- 描画関数群 ---
  function drawCourt() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(court.x, court.y, court.w, court.h);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
    ctx.fillRect(court.x, court.y, court.w, court.netY - court.y);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(court.x, court.netY - 100); ctx.lineTo(court.x + court.w, court.netY - 100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(court.x, court.netY + 100); ctx.lineTo(court.x + court.w, court.netY + 100); ctx.stroke();

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.strokeRect(court.x, court.y, court.w, court.h);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(court.x - 10, court.netY);
    ctx.lineTo(court.x + court.w + 10, court.netY);
    ctx.stroke();
  }

  function createSmoothPath(ctx, rFwd, rBwd, rLeft, rRight) {
    const K = 0.5522847;
    ctx.beginPath();
    ctx.moveTo(0, -rFwd);
    ctx.bezierCurveTo(rRight * K, -rFwd, rRight, -rFwd * K, rRight, 0);
    ctx.bezierCurveTo(rRight, rBwd * K, rRight * K, rBwd, 0, rBwd);
    ctx.bezierCurveTo(-rLeft * K, rBwd, -rLeft, rBwd * K, -rLeft, 0);
    ctx.bezierCurveTo(-rLeft, -rFwd * K, -rLeft * K, -rFwd, 0, -rFwd);
    ctx.closePath();
  }

  function drawDefenseAreas() {
    const courtPlayers = getCourtPlayers();
    courtPlayers.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(((p.angle - 90) * Math.PI) / 180);

      const rFwd   = p.fwd * 12;
      const rBwd   = p.bwd * 12;
      const rLeft  = p.left * 12;
      const rRight = p.right * 12;

      createSmoothPath(ctx, rFwd, rBwd, rLeft, rRight);

      ctx.fillStyle = p.color + '44'; // 各自の持ち色を透過描画
      ctx.fill();
      ctx.strokeStyle = p.color + 'aa';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    });
  }

  function isPointInPlayerRange(px, py, p) {
    const rad = -((p.angle - 90) * Math.PI) / 180;
    const dx = px - p.x;
    const dy = py - p.y;

    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);

    const rx = (lx >= 0) ? p.right * 12 : p.left * 12;
    const ry = (ly < 0)  ? p.fwd * 12   : p.bwd * 12;

    return ((lx * lx) / (rx * rx) + (ly * ly) / (ry * ry)) <= 1.0;
  }

  // 重なった警告領域を赤色（塗りつぶし）で表示する処理
  function drawOverlapAreaRed() {
    const courtPlayers = getCourtPlayers();
    const step = 6; // グリッド描画の解像度（数値が小さいほど滑らか）

    ctx.fillStyle = 'rgba(239, 68, 68, 0.45)'; // 警告の鮮やかな赤（半透明）

    for (let gy = court.netY; gy <= court.y + court.h; gy += step) {
      for (let gx = court.x; gx <= court.x + court.w; gx += step) {
        let count = 0;
        courtPlayers.forEach(p => {
          if (isPointInPlayerRange(gx, gy, p)) count++;
        });

        // 2人以上の守備範囲が重複している場合、そのピクセル（領域）を赤く塗る
        if (count >= 2) {
          ctx.fillRect(gx - step/2, gy - step/2, step + 1, step + 1);
        }
      }
    }
  }

  function drawPlayers() {
    const courtPlayers = getCourtPlayers();
    courtPlayers.forEach(p => {
      const isSelected = (p.id === selectedPosId);

      if (isSelected) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(37, 99, 235, 0.2)';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(((p.angle - 90) * Math.PI) / 180);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -32);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();

      if (isSelected) {
        ctx.beginPath();
        ctx.arc(0, -42, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.displayName || p.posName, p.x, p.y);
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawCourt();
    drawDefenseAreas();
    drawOverlapAreaRed(); // 警告エリア（重なり部分）の赤色塗りを描画
    drawPlayers();
  }

  // タップ・操作イベント
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function getAngleFromPoint(px, py, mx, my) {
    const rad = Math.atan2(my - py, mx - px);
    let deg = Math.round((rad * 180) / Math.PI) + 90;
    if (deg > 180) deg -= 360;
    if (deg < -180) deg += 360;
    return deg;
  }

  function handleStart(e) {
    const pos = getCanvasPos(e);
    const courtPlayers = getCourtPlayers();
    const selectedP = getSelectedPlayer();

    if (selectedP) {
      const rad = ((selectedP.angle - 90) * Math.PI) / 180;
      const handleX = selectedP.x + 42 * Math.cos(rad);
      const handleY = selectedP.y + 42 * Math.sin(rad);

      if (Math.hypot(handleX - pos.x, handleY - pos.y) < 22) {
        activeInteraction = 'rotate';
        e.preventDefault();
        return;
      }
    }

    for (let i = courtPlayers.length - 1; i >= 0; i--) {
      const p = courtPlayers[i];
      if (Math.hypot(p.x - pos.x, p.y - pos.y) < 32) {
        activeInteraction = 'move';
        selectedPosId = p.id;
        touchOffsetX = pos.x - p.x;
        touchOffsetY = pos.y - p.y;
        updateUI();
        render();
        e.preventDefault();
        return;
      }
    }
  }

  function handleMove(e) {
    if (!activeInteraction) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    const currentPos = rotationPositions[currentRotation].find(p => p.id === selectedPosId);
    if (!currentPos) return;

    if (activeInteraction === 'move') {
      currentPos.x = Math.max(court.x, Math.min(court.x + court.w, pos.x - touchOffsetX));
      currentPos.y = Math.max(court.netY + 15, Math.min(court.y + court.h, pos.y - touchOffsetY));
    } else if (activeInteraction === 'rotate') {
      currentPos.angle = getAngleFromPoint(currentPos.x, currentPos.y, pos.x, pos.y);
      updateUI();
    }
    render();
  }

  function handleEnd() {
    activeInteraction = null;
  }

  canvas.addEventListener('mousedown', handleStart);
  canvas.addEventListener('mousemove', handleMove);
  canvas.addEventListener('mouseup', handleEnd);
  canvas.addEventListener('touchstart', handleStart, { passive: false });
  canvas.addEventListener('touchmove', handleMove, { passive: false });
  canvas.addEventListener('touchend', handleEnd);

  // 初期化
  updatePatternSelect();
  updateUI();
  render();
</script>
</body>
</html>
